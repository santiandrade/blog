name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un único deploy a la vez; no cancelamos el que ya está en curso para no
# dejar el servicio de Pages a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Comprobar el generador RSS
        run: node --test scripts/generate-rss.test.js

      - name: Comprobar que los feeds versionados están al día
        run: node scripts/generate-rss.js --check

      # include-hidden-files es obligatorio aquí: desde la v4 esta acción
      # excluye los ficheros que empiezan por punto, y sin esto `.nojekyll`
      # desaparecería del sitio publicado. `.git` y `.github` quedan fuera
      # igualmente, los excluye la acción pase lo que pase.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No se le pasa `timeout`: deploy-pages lo capa a MAX_TIMEOUT = 600000 ms
      # (10 min), que es además su valor por defecto, así que cualquier cifra
      # mayor se ignora con un warning y sólo confunde a quien lea esto.
      #
      # Si el step aborta con "Timeout reached, aborting!", el backend de Pages
      # está tardando de más en sincronizar; no es un problema del sitio ni del
      # artefacto. El remedio es relanzar el job (`gh run rerun <id> --failed`),
      # que es lo que resolvió el incidente del 2026-08-06.
      #
      # Ojo al diagnosticar: `GET /repos/{owner}/{repo}/pages` puede quedarse
      # devolviendo "status": "errored" indefinidamente aunque el deploy vaya
      # bien. La fuente de verdad es el estado del deployment y el
      # Last-Modified del sitio publicado.
      - id: deployment
        uses: actions/deploy-pages@v5
